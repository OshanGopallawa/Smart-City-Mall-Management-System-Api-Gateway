events {
  worker_connections 1024;
}

http {

  # ── Allowed origins ─────────────────────────────────────────────
  map $http_origin $cors_origin {
    default                                      "";
    "https://mall-frontend-u0dw.onrender.com"   $http_origin;
    "http://localhost:3000"                      $http_origin;
    "http://localhost:5173"                      $http_origin;
  }

  # ── Upstream services (replaced at startup by entrypoint.sh) ────
  upstream user-service {
    server USER_SERVICE_HOST;
  }
  upstream operator-service {
    server OPERATOR_SERVICE_HOST;
  }
  upstream mall-api-service {
    server MALL_API_SERVICE_HOST;
  }
  upstream analytics-service {
    server ANALYTICS_SERVICE_HOST;
  }

  server {
    listen 80;

    # ── CORS headers on every response ─────────────────────────────
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header Access-Control-Allow-Headers     'Authorization, Content-Type, X-Internal-API-Key, Accept' always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Vary                             Origin always;

    # ── Preflight OPTIONS handler ───────────────────────────────────
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Methods     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
      add_header Access-Control-Allow-Headers     'Authorization, Content-Type, X-Internal-API-Key, Accept' always;
      add_header Access-Control-Allow-Credentials 'true' always;
      add_header Content-Length                   0;
      return 204;
    }

    # ── Gateway root & health ───────────────────────────────────────
    location = / {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ── User Service routes ─────────────────────────────────────────
    location /api/auth/users/ {
      proxy_pass          https://user-service/api/auth/;
      proxy_set_header    Host              USER_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    location /api/users/ {
      proxy_pass          https://user-service/api/users/;
      proxy_set_header    Host              USER_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    # ── Operator Service routes ─────────────────────────────────────
    location /api/auth/operators/ {
      proxy_pass          https://operator-service/api/auth/;
      proxy_set_header    Host              OPERATOR_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    location /api/operators/ {
      proxy_pass          https://operator-service/api/operators/;
      proxy_set_header    Host              OPERATOR_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    # ── Mall API Service routes ─────────────────────────────────────
    location /api/stores/ {
      proxy_pass          https://mall-api-service/api/stores/;
      proxy_set_header    Host              MALL_API_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    location /api/deals/ {
      proxy_pass          https://mall-api-service/api/deals/;
      proxy_set_header    Host              MALL_API_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    location /api/events/ {
      proxy_pass          https://mall-api-service/api/events/;
      proxy_set_header    Host              MALL_API_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    # ── Analytics Service routes ────────────────────────────────────
    location /api/analytics/ {
      proxy_pass          https://analytics-service/api/analytics/;
      proxy_set_header    Host              ANALYTICS_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    location /api/internal/ {
      proxy_pass          https://analytics-service/api/internal/;
      proxy_set_header    Host              ANALYTICS_SERVICE_HOST;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
    }

    # ── Downstream health checks ────────────────────────────────────
    location /health/users {
      proxy_pass https://user-service/health;
      proxy_set_header Host USER_SERVICE_HOST;
      proxy_ssl_server_name on;
    }
    location /health/operators {
      proxy_pass https://operator-service/health;
      proxy_set_header Host OPERATOR_SERVICE_HOST;
      proxy_ssl_server_name on;
    }
    location /health/mall {
      proxy_pass https://mall-api-service/health;
      proxy_set_header Host MALL_API_SERVICE_HOST;
      proxy_ssl_server_name on;
    }
    location /health/analytics {
      proxy_pass https://analytics-service/health;
      proxy_set_header Host ANALYTICS_SERVICE_HOST;
      proxy_ssl_server_name on;
    }
  }
}