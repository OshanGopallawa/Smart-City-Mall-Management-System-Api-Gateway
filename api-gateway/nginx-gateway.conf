events {
  worker_connections 1024;
}

http {
  map_hash_bucket_size 128;

  resolver 8.8.8.8 8.8.4.4 valid=30s;
  resolver_timeout 10s;

  map $http_origin $cors_origin {
    default                                     "";
    "https://smart-city-mall-management-system.onrender.com"  $http_origin;
    "http://localhost:3000"                     $http_origin;
    "http://localhost:5173"                     $http_origin;
  }

  server {
    listen 80;
    
    proxy_redirect http:// https://;
    absolute_redirect off;
    port_in_redirect off;

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header Access-Control-Allow-Headers     'Authorization, Content-Type, X-Internal-API-Key, Accept' always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Vary                             Origin always;

    proxy_connect_timeout  10s;
    proxy_send_timeout     15s;
    proxy_read_timeout     30s;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = / {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ── User Service ────────────────────────────────────────────────
    location /api/auth/users/ {
      set $upstream USER_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    location /api/users/ {
      set $upstream USER_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    # ── Operator Service ────────────────────────────────────────────
    location /api/auth/operators/ {
      set $upstream OPERATOR_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    location /api/operators/ {
      set $upstream OPERATOR_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    # ── Mall API Service ────────────────────────────────────────────
    location /api/stores/ {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    location /api/deals/ {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    location /api/events/ {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    # ── Analytics Service ───────────────────────────────────────────
    location /api/analytics/ {
      set $upstream ANALYTICS_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    # Internal — block public access
    location /api/internal/ {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 127.0.0.1;
      deny  all;

      set $upstream ANALYTICS_SERVICE_HOST;
      proxy_pass            https://$upstream$request_uri;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
      proxy_hide_header     Access-Control-Allow-Origin;
      proxy_hide_header     Access-Control-Allow-Methods;
      proxy_hide_header     Access-Control-Allow-Headers;
      proxy_hide_header     Access-Control-Allow-Credentials;
    }

    # ── Health checks ───────────────────────────────────────────────
    location /health/users {
      set $upstream USER_SERVICE_HOST;
      proxy_pass            https://$upstream/health;
      proxy_set_header      Host              $upstream;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }
    location /health/operators {
      set $upstream OPERATOR_SERVICE_HOST;
      proxy_pass            https://$upstream/health;
      proxy_set_header      Host              $upstream;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }
    location /health/mall {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass            https://$upstream/health;
      proxy_set_header      Host              $upstream;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }
    location /health/analytics {
      set $upstream ANALYTICS_SERVICE_HOST;
      proxy_pass            https://$upstream/health;
      proxy_set_header      Host              $upstream;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }
  }
}