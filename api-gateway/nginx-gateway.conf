events {
  worker_connections 1024;
}

http {

  resolver 8.8.8.8 8.8.4.4 valid=30s;
  resolver_timeout 10s;

  map $http_origin $cors_origin {
    default                                     "";
    "https://mall-frontend-u0dw.onrender.com"  $http_origin;
    "http://localhost:3000"                     $http_origin;
    "http://localhost:5173"                     $http_origin;
  }

  server {
    listen 80;

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header Access-Control-Allow-Headers     'Authorization, Content-Type, X-Internal-API-Key, Accept' always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Vary                             Origin always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = / {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ── User Service ────────────────────────────────────────────────
    location /api/auth/users/ {
      set $upstream USER_SERVICE_HOST;
      proxy_pass            https://$upstream/api/auth/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    location /api/users/ {
      set $upstream USER_SERVICE_HOST;
      proxy_pass            https://$upstream/api/users/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    # ── Operator Service ────────────────────────────────────────────
    location /api/auth/operators/ {
      set $upstream OPERATOR_SERVICE_HOST;
      proxy_pass            https://$upstream/api/auth/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    location /api/operators/ {
      set $upstream OPERATOR_SERVICE_HOST;
      proxy_pass            https://$upstream/api/operators/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    # ── Mall API Service ────────────────────────────────────────────
    location /api/stores/ {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass            https://$upstream/api/stores/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    location /api/deals/ {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass            https://$upstream/api/deals/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    location /api/events/ {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass            https://$upstream/api/events/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    # ── Analytics Service ───────────────────────────────────────────
    location /api/analytics/ {
      set $upstream ANALYTICS_SERVICE_HOST;
      proxy_pass            https://$upstream/api/analytics/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    location /api/internal/ {
      set $upstream ANALYTICS_SERVICE_HOST;
      proxy_pass            https://$upstream/api/internal/;
      proxy_set_header      Host              $upstream;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_ssl_name        $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify      off;
    }

    # ── Health checks ───────────────────────────────────────────────
    location /health/users {
      set $upstream USER_SERVICE_HOST;
      proxy_pass https://$upstream/health;
      proxy_set_header Host $upstream;
      proxy_ssl_name $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
    }
    location /health/operators {
      set $upstream OPERATOR_SERVICE_HOST;
      proxy_pass https://$upstream/health;
      proxy_set_header Host $upstream;
      proxy_ssl_name $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
    }
    location /health/mall {
      set $upstream MALL_API_SERVICE_HOST;
      proxy_pass https://$upstream/health;
      proxy_set_header Host $upstream;
      proxy_ssl_name $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
    }
    location /health/analytics {
      set $upstream ANALYTICS_SERVICE_HOST;
      proxy_pass https://$upstream/health;
      proxy_set_header Host $upstream;
      proxy_ssl_name $upstream;
      proxy_ssl_server_name on;
      proxy_ssl_verify off;
    }
  }
}